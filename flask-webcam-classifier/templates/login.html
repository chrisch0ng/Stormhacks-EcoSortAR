{% extends "base.html" %}

{% block title %}Login - EcoSort AR{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header text-center py-3">
                <h4 class="mb-0"><i class="bi bi-box-arrow-in-right"></i> Welcome Back</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Enter your username or email" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Enter your password" required>
                        </div>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                </form>

                <div class="text-center">
                    <p class="mb-0">Don't have an account?
                        <a href="{{ url_for('auth.register') }}" class="text-decoration-none" style="color: #667eea;">
                            Sign up here
                        </a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Features Preview -->
        <div class="card mt-4">
            <div class="card-body">
                <h6 class="text-center mb-3">Why Join EcoSort AR?</h6>
                <div class="row text-center">
                    <div class="col-4">
                        <i class="bi bi-camera-video-fill text-primary fs-3"></i>
                        <p class="small mb-0 mt-2">Real-time AI Classification</p>
                    </div>
                    <div class="col-4">
                        <i class="bi bi-trophy-fill text-warning fs-3"></i>
                        <p class="small mb-0 mt-2">Earn Points & Badges</p>
                    </div>
                    <div class="col-4">
                        <i class="bi bi-globe-americas text-success fs-3"></i>
                        <p class="small mb-0 mt-2">Track Your Impact</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
